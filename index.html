<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Crisanta licores y vapers</title>
 <link rel="icon" type="image/png" href="imgfavicon.png.png">
 <meta property="og:title" content="Catálogo - Crisanta">
<meta property="og:description" content="Licores y vapers">
<meta property="og:image" content="https://TUUSUARIO.github.io/TUREPOSITORIO/imgfavicon.png.png">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: #f4f6fa; color: #0f172a; }
  .top { background: #0b1324; position: sticky; top: 0; z-index: 10; }
  .bar { max-width: 1100px; margin: auto; padding: 14px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 200px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: #2563eb; display: grid; place-items: center; color: #fff; font-size: 22px; }
  .brand small { display: block; font-size: 11px; letter-spacing: .15em; color: #7b8db0; }
  .brand b { color: #fff; font-size: 18px; }
  .search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; background: #141f36;
            border: 1px solid #2a3a55; border-radius: 12px; padding: 0 14px; height: 42px; }
  .search input { background: none; border: none; outline: none; color: #fff; flex: 1; font: inherit; }
  .pills { max-width: 1100px; margin: auto; padding: 10px 16px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { border-radius: 999px; padding: 8px 16px; font: 500 14px 'Inter'; border: 1px solid #2a3a55;
          background: none; color: #cbd5e1; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .pill.on { background: #fff; color: #0f172a; border-color: #fff; }
  .pill span { font-size: 11px; background: rgba(148,163,184,.25); padding: 2px 8px; border-radius: 999px; }
  main { max-width: 1100px; margin: auto; padding: 24px 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .head h1 { margin: 0; font-size: 26px; }
  .head span { color: #64748b; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .card { background: #fff; border-radius: 18px; overflow: hidden; cursor: pointer; border: 1px solid #e5e9f0; transition: transform .2s; }
  .card:hover { transform: translateY(-3px); }
  .card img { width: 100%; height: 220px; object-fit: contain; background: #fff; padding: 10px; }
  .info { padding: 14px 16px 16px; }
  .info h3 { margin: 0 0 6px; font-size: 16px; text-transform: uppercase; }
  .info p { margin: 0 0 12px; font-size: 14px; color: #64748b; line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 12px; background: #e7f6ee; color: #15803d; padding: 4px 12px; border-radius: 999px; }
  dialog { border: none; border-radius: 18px; padding: 0; max-width: 420px; width: 92%; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog img { width: 100%; max-height: 300px; object-fit: contain; padding: 10px; }
  .m { padding: 16px 20px 20px; }
  .m h2 { margin: 0 0 8px; text-transform: uppercase; font-size: 20px; }
  .m p { color: #475569; line-height: 1.6; }
  .btns { display: flex; gap: 10px; margin-top: 16px; }
  .btns a, .btns button { flex: 1; padding: 11px; border-radius: 10px; font: 500 14px 'Inter'; text-align: center; cursor: pointer; text-decoration: none; }
  .wa { background: #22c55e; color: #fff; border: none; }
  .close { background: #fff; border: 1px solid #cbd5e1; color: #0f172a; }
  footer { text-align: center; font-size: 13px; color: #94a3b8; padding: 10px 0 30px; }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
   <div class="brand"><div class="logo"><img src="imgfavicon.png.png" alt="Crisanta" style="width:100%;height:100%;object-fit:cover;border-radius:12px;"></div><div><small>LICORES Y VAPERS</small><b>Crisanta</b></div></div>
    <div class="search">🔍<input id="q" placeholder="Buscar producto…"></div>
  </div>
  <div class="pills" id="pills"></div>
</div>

<main>
  <div class="head"><h1 id="titulo"></h1><span id="conteo"></span></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Venta exclusiva para mayores de 18 años</footer>

<dialog id="modal">
  <img id="m-img" alt="">
  <div class="m">
    <h2 id="m-nombre"></h2>
    <span class="badge">🛡 Garantía incluida</span>
    <p id="m-desc"></p>
    <div class="btns">
      <a id="m-wa" class="wa" target="_blank">Preguntar por WhatsApp</a>
      <button class="close" onclick="modal.close()">Cerrar</button>
    </div>
  </div>
</dialog>

<script>
  // ✏️ Tu número con indicativo, sin + ni espacios
  const WHATSAPP = "573001234567";

  // ✏️ Tus productos
  const productos = [
    { nombre: "Producto 5 mil usos", categoria: "Catálogo mayorista con garantía",
      imagen: "img/producto1.jpg", descripcion: "Descripción del producto 1." },
    { nombre: "Producto 10 mil usos", categoria: "Catálogo mayorista con garantía",
      imagen: "img/producto2.jpg", descripcion: "Descripción del producto 2." },
  ];

  const cats = [...new Set(productos.map(p => p.categoria))];
  let actual = cats[0], busqueda = "";
  const $ = id => document.getElementById(id);

  function pintarPills() {
    $("pills").innerHTML = "";
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "pill" + (c === actual ? " on" : "");
      b.innerHTML = `${c}<span>${productos.filter(p => p.categoria === c).length}</span>`;
      b.onclick = () => { actual = c; pintarPills(); pintar(); };
      $("pills").appendChild(b);
    });
  }

  function pintar() {
    const lista = productos.filter(p => p.categoria === actual &&
      p.nombre.toLowerCase().includes(busqueda));
    $("titulo").textContent = actual;
    $("conteo").textContent = lista.length + (lista.length === 1 ? " producto" : " productos");
    $("grid").innerHTML = "";
    lista.forEach(p => {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<img src="${p.imagen}" alt="${p.nombre}">
        <div class="info"><h3>${p.nombre}</h3><p>${p.descripcion}</p>
        <span class="badge">🛡 Garantía incluida</span></div>`;
      c.onclick = () => abrir(p);
      $("grid").appendChild(c);
    });
  }

  function abrir(p) {
    $("m-img").src = p.imagen;
    $("m-nombre").textContent = p.nombre;
    $("m-desc").textContent = p.descripcion;
    $("m-wa").href = `https://wa.me/${WHATSAPP}?text=` +
      encodeURIComponent(`Hola, me interesa el producto: ${p.nombre}`);
    $("modal").showModal();
  }

  $("q").oninput = e => { busqueda = e.target.value.toLowerCase(); pintar(); };
  $("modal").onclick = e => { if (e.target.id === "modal") $("modal").close(); };
  pintarPills(); pintar();
</script>
</body>
</html>
